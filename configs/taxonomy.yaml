# Global Class Taxonomy & Domain Translation Configuration
# Source: Project Specification & PROJECT_SOURCE_OF_TRUTH.md

global_taxonomy:
  0: "healthy_crop"
  1: "dead_crop"
  2: "cargo_ship"
  3: "passenger_ship"
  4: "open"
  5: "short"

# Domain-specific model local index to global index mapping
# Note: Verified via data.yaml when provided by model owners.
domain_mappings:
  agriculture:
    name: "Agriculture Crop Inspection"
    checkpoint: "checkpoints/Agriculture_bestweight.pt"
    expected_classes: 2
    local_to_global:
      0: 0  # 0 -> healthy_crop
      1: 1  # 1 -> dead_crop
    verified: false

  ships:
    name: "Maritime Vessel Detection"
    checkpoint: "checkpoints/best (1).pt"
    expected_classes: 2
    local_to_global:
      0: 2  # 0 -> cargo_ship (Tentative: to confirm via data.yaml)
      1: 3  # 1 -> passenger_ship (Tentative: to confirm via data.yaml)
    verified: false

  space_electronics:
    name: "Space Electronics Solder & Trace Inspection"
    checkpoint: "checkpoints/space_electronics.pt"
    expected_classes: 2
    local_to_global:
      0: 4  # 0 -> open (Tentative: must confirm via data.yaml whether 0 is open or short)
      1: 5  # 1 -> short (Tentative: must confirm via data.yaml)
    verified: false
